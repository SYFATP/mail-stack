# Dedicated local integration stack. Never loads the production .env.
name: mail-stack-integration
services:
  dns:
    image: mail-stack-integration-api:local
    entrypoint: ["python", "/fixtures/dns_fixture.py"]
    volumes:
      - ./dns_fixture.py:/fixtures/dns_fixture.py:ro
    networks:
      testnet:
        ipv4_address: 172.31.240.53
  api:
    image: mail-stack-integration-api:local
    entrypoint: ["python", "/fixtures/api_domain_fixture.py"]
    environment:
      MAIL_DOMAIN: example.test
      MAIL_HOST: mail.example.test
      MAILBOX_USERS: test,postmaster
      ADMIN_PASSWORD: integration-only-password
      API_KEY_PEPPER: integration-only-pepper
      INGEST_INTERVAL_SECONDS: "0.5"
      CUR_SCAN_INTERVAL_SECONDS: "10"
      SMTP_SUBMISSION_HOST: postfix
      # Public test material, never use this keyring in production.
      MAIL_CREDENTIAL_KEYS: '{"integration-v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      MAIL_CREDENTIAL_ACTIVE_KEY: integration-v1
      ALLOW_LOCAL_PROVIDER_HTTP: "1"
    ports: ["127.0.0.1:18091:8000"]
    volumes:
      - runtime:/app-data
      - maildata:/maildata
      - keys:/dkim:ro
      - ./domain_provider_fixture.py:/fixtures/domain_provider_fixture.py:ro
      - ./api_domain_fixture.py:/fixtures/api_domain_fixture.py:ro
    dns: [172.31.240.53]
    networks:
      testnet:
        ipv4_address: 172.31.240.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  opendkim:
    image: mail-stack-integration-opendkim:local
    environment:
      MAIL_DOMAIN: example.test
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - runtime:/app-data
      - keys:/etc/opendkim
    networks:
      testnet:
        ipv4_address: 172.31.240.12
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8891"]
      interval: 2s
      timeout: 2s
      retries: 30
  postfix:
    image: mail-stack-integration-postfix:sqlite
    environment:
      MAIL_DOMAIN: example.test
      MAIL_HOST: mail.example.test
      POSTFIX_MYNETWORKS: 127.0.0.0/8,172.31.240.10/32
    depends_on:
      opendkim:
        condition: service_healthy
      dns:
        condition: service_started
    dns: [172.31.240.53]
    ports: ["127.0.0.1:25260:25"]
    volumes:
      - runtime:/app-data
      - maildata:/var/mail/vhosts
      - queue:/var/spool/postfix
      - maillogs:/var/log/mail
    networks:
      testnet:
        ipv4_address: 172.31.240.11
networks:
  testnet:
    ipam:
      config:
        - subnet: 172.31.240.0/24
volumes:
  runtime:
  maildata:
  queue:
  keys:
  maillogs:
