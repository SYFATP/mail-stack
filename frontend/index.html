  <script id="appearance-bootstrap">
    (()=>{
      const STYLE_KEY='mail_ui_style',MODE_KEY='mail_color_mode';
      const styles=['modern','classic'],modes=['dark','light','system'];
      const media=typeof matchMedia==='function'?matchMedia('(prefers-color-scheme: dark)'):null;
      const read=(key,values,fallback)=>{try{const value=localStorage.getItem(key);return values.includes(value)?value:fallback}catch{return fallback}};
      let style=read(STYLE_KEY,styles,'modern'),mode=read(MODE_KEY,modes,'dark');
      function apply(){
        const dark=style==='classic'||mode==='dark'||(mode==='system'&&!!media?.matches);
        document.documentElement.dataset.uiStyle=style;
        document.documentElement.dataset.theme=dark?'dark':'light';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content',style==='classic'?'#0b1220':dark?'#181a1f':'#ffffff');
        const styleSelect=document.getElementById('ui-style'),modeSelect=document.getElementById('color-mode');
        if(styleSelect)styleSelect.value=style;
        if(modeSelect){modeSelect.value=mode;modeSelect.closest('label').hidden=style==='classic'}
      }
      function setPreference(nextStyle,nextMode){
        if(!styles.includes(nextStyle)||!modes.includes(nextMode))return;
        style=nextStyle;mode=nextMode;
        try{localStorage.setItem(STYLE_KEY,style);localStorage.setItem(MODE_KEY,mode)}catch{}
        apply();
      }
      globalThis.mailAppearance={
        get preferences(){return {style,mode}},
        markup(){return `<div class="appearance-controls" role="group" aria-label="界面外观"><label><span class="visually-hidden">UI 风格</span><select id="ui-style" aria-label="UI 风格"><option value="modern" ${style==='modern'?'selected':''}>简洁风格</option><option value="classic" ${style==='classic'?'selected':''}>经典风格</option></select></label><label ${style==='classic'?'hidden':''}><span class="visually-hidden">明暗模式</span><select id="color-mode" aria-label="明暗模式"><option value="dark" ${mode==='dark'?'selected':''}>深色模式</option><option value="light" ${mode==='light'?'selected':''}>浅色模式</option><option value="system" ${mode==='system'?'selected':''}>跟随系统</option></select></label></div>`},
        bind(){
          const styleSelect=document.getElementById('ui-style'),modeSelect=document.getElementById('color-mode');
          if(styleSelect)styleSelect.onchange=()=>setPreference(styleSelect.value,mode);
          if(modeSelect)modeSelect.onchange=()=>setPreference(style,modeSelect.value);
          apply();
        },
        setPreference
      };
      media?.addEventListener('change',()=>{if(mode==='system')apply()});
      window.addEventListener('storage',event=>{
        if(event.key===null||event.key===STYLE_KEY||event.key===MODE_KEY){
          style=read(STYLE_KEY,styles,'modern');mode=read(MODE_KEY,modes,'dark');apply();
        }
      });
      apply();
    })();
  </script>

    /* Keep the domain list within the viewport; only the table body scrolls. */
    body:has(.domain-page){overflow:hidden}
    .shell:has(.domain-page){height:100vh;height:100dvh;min-height:0;grid-template-rows:minmax(0,1fr)}
    .shell:has(.domain-page) .main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
    .shell:has(.domain-page) .topbar{flex:none}
    .shell:has(.domain-page) .content{flex:1;min-height:0;width:100%;overflow:hidden}
    .domain-page{height:100%;min-height:0;display:flex;flex-direction:column}
    .domain-page>.page-head,.domain-page>.domain-status-bar{flex:none}
    .domain-page>.panel{flex:1;min-height:0;display:flex;flex-direction:column}
    .domain-page>.panel>:not(.table-wrap){flex:none}
    .domain-page>.panel>.table-wrap{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
    .domain-page .domain-bulk-result{max-height:120px;overflow:auto}
    .domain-table thead{position:sticky;top:0;z-index:1;background:var(--panel)}
    @media(max-width:600px){
      .domain-page .domain-bulk-toolbar{flex-wrap:nowrap;overflow-x:auto}
      .domain-page .domain-bulk-toolbar>*{flex-shrink:0}
      .domain-page .pagination{padding:10px 11px;gap:8px}
      .domain-page .pagination-actions{flex-wrap:nowrap;max-width:100%;overflow-x:auto}
      .domain-page .pagination-actions>*{flex-shrink:0}
    }
    /* The control workbench gives the domain table the remaining viewport height. */
    body:has(.control-page){overflow:hidden}
    .shell:has(.control-page){height:100vh;height:100dvh;min-height:0;grid-template-rows:minmax(0,1fr)}
    .shell:has(.control-page) .main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
    .shell:has(.control-page) .topbar{flex:none}
    .shell:has(.control-page) .content{flex:1;min-height:0;width:100%;max-width:none;padding-top:20px;padding-bottom:20px;overflow:hidden}
    .control-page{height:100%;min-height:0;display:flex;flex-direction:column;gap:10px}

  <div id="app"></div><div id="modal-root"></div><div id="toast-root"></div><div id="monitor-root"></div>
  <script id="server-monitor">
    (() => {
      const KEYS=['cpu','memory','disk'],LABELS={cpu:'CPU',memory:'内存',disk:'磁盘'};

      const LEVELS={normal:'正常',warning:'偏高',critical:'过高',unknown:'暂无数据'};
      const POLL_MS=5000,STALE_MS=20000;
      const $=selector=>document.querySelector(selector);
      const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

      const validThresholds=value=>KEYS.every(key=>value?.[key]&&percent(value[key].warning)&&percent(value[key].critical)&&value[key].warning<value[key].critical);
      const level=(value,threshold,stale=false)=>!percent(value)||stale?'unknown':value>=threshold.critical?'critical':value>=threshold.warning?'warning':'normal';
      let token='',generation=0,revision=0,snapshot=null,savedThresholds=null,error='',receivedAt=0,sampleAge=Infinity;
      let pollTimer=null,staleTimer=null,controller=null,saveController=null,refreshing=false,saving=false,dirty=false,selected='cpu';

v class="notice domain-bulk-result hidden" id="domain-bulk-result" role="status" aria-live="polite"></div><div class="table-wrap"><table class="table domain-table"><thead><tr><th scope="col" aria-label="选择"></th><th scope="col">操作</th><th scope="col">域名</th><th scope="col">用户</th><th scope="col">注册</th><th scope="col">DKIM</th><th scope="col">DNS provider</th><th scope="col">状态</th></tr></thead><tbody id="domain-table-body"></tbody></table></div><div class="pagination"><span id="domain-pagination-summary" role="status" aria-live="polite"></span><div class="pagination-actions"><button class="btn btn-small btn-secondary" id="domain-prev-page">上一页</button><div class="pagination-actions" id="domain-page-buttons"></div><button class="btn btn-small btn-secondary" id="domain-next-page">下一页</button><label for="domain-jump-page">跳转</label><input id="domain-jump-page" class="page-jump" type="number" min="1" step="1" value="${state.domainPage}" aria-label="跳转页码"><button class="btn btn-small btn-secondary" id="domain-jump-btn">确定</button></div></div></div></div>`;

    function showDnsRecords(data){const records=data.records||[];const provider=data.provider_label||data.provider||'DNS';const message=data.message?`<div class="notice warning" style="margin-bottom:14px">${esc(data.message)}</div>`:'';$('#modal-root').innerHTML=`<div class="modal-backdrop" id="dns-modal-bg"><div class="modal"><div class="modal-head"><h3>DNS 记录 · ${esc(data.domain)}</h3><button class="btn btn-ghost" id="close-dns-modal">✕</button></div><div class="modal-body">${message}<div class="notice" style="margin-bottom:14px">Provider：${esc(provider)} · Zone ID：${esc(data.zone_id||'—')} · 共 ${records.length} 条记录</div><div class="table-wrap"><table class="table"><thead><tr><th>类型</th><th>名称</th><th>内容</th><th>TTL</th><th>优先级</th></tr></thead><tbody>${records.length?records.map(r=>`<tr><td>${esc(r.type||'')}</td><td>${esc(r.name||'')}</td><td style="white-space:normal;min-width:260px;word-break:break-word">${esc(r.content||'')}</td><td>${esc(r.ttl||'auto')}</td><td>${r.priority==null?'—':esc(r.priority)}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">${esc(data.provider==='manual'?'由外部 DNS 服务商管理，当前没有可读取的在线记录。':'当前 provider 中没有 DNS 记录')}</div></td></tr>`}</tbody></table></div></div></div></div>`;$('#close-dns-modal').onclick=closeModal;$('#dns-modal-bg').onclick=e=>{if(e.target.id==='dns-modal-bg')closeModal()}}
    const SEND_STATUS_LABELS={queued:'排队中',running:'提交中',submitted_to_mta:'邮件服务器已接受',partial:'部分收件人失败',failed:'发送失败',cancelled:'已取消',submission_unknown:'提交结果待确认'};
    const sendStatusLabel=value=>SEND_STATUS_LABELS[value]||value||'未知状态';
    const sendTransportLabel=value=>({smtp:'SMTP',brevo_api:'Brevo API'}[value]||value||'SMTP');
    function sendStatusMarkup(value){return `<span class="send-status ${value==='submitted_to_mta'?'is-accepted':['failed','partial','submission_unknown'].includes(value)?'is-error':''}">${esc(sendStatusLabel(value))}</span>`}
    let sendPageRevision=0,sendHistoryRevision=0;
    async function loadSendHistory(){
      const host=$('#send-history-body');if(!host)return;
      const revision=++sendHistoryRevision,token=state.token;
      try{
        const data=await api('/send?limit=20');
        if(state.token!==token||state.tab!=='send'||revision!==sendHistoryRevision)return;
        const rows=data.items||[];
        $('#send-history-summary').textContent=`最近 ${rows.length} 条 / 共 ${Number(data.total??rows.length)} 条 · 可查看正文与附件`;
        host.innerHTML=rows.length?rows.map(r=>`<tr><td><code>${esc(r.request_id)}</code></td><td>${esc(r.sender||'—')}</td><td>${(r.recipients||[]).map(value=>esc(value)).join('<br>')||'—'}</td><td>${sendStatusMarkup(r.status)}<small>${esc(sendTransportLabel(r.transport))} · 接受 ${(r.accepted||[]).length} / 拒绝 ${Object.keys(r.rejected||{}).length}</small></td><td>${esc(fmtDate(r.updated_at||r.created_at))}</td><td><div class="head-actions"><button type="button" class="btn btn-small btn-secondary" data-send-detail="${esc(r.request_id)}">查看详情</button>${['failed','cancelled','submission_unknown'].includes(r.status)?`<button type="button" class="btn btn-small btn-secondary" data-replay-send="${esc(r.request_id)}">重新入队</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty">暂无发件记录</div></td></tr>';
        $$('[data-send-detail]').forEach(button=>button.onclick=()=>showSendDetail(button.dataset.sendDetail));
        $$('[data-replay-send]').forEach(button=>button.onclick=async()=>{
          if(button.disabled)return;button.disabled=true;
          try{await api('/send/'+encodeURIComponent(button.dataset.replaySend)+'/replay',{method:'POST'});if(state.token!==token)return;toast('发件已重新入队');await loadSendHistory()}
          catch(error){if(state.token===token)toast(error.message,true)}finally{button.disabled=false}
        });
      }catch(error){if(state.token===token&&state.tab==='send'&&revision===sendHistoryRevision)host.innerHTML=`<tr><td colspan="6"><div class="empty">发件记录读取失败：${esc(error.message)}</div></td></tr>`}
    }
    async function showSendDetail(requestId){

          <div class="meta"><label>请求编号</label><div><code>${esc(requestId)}</code></div></div>
        </div>
        ${status.last_error?`<div class="notice warning">最近错误：${esc(status.last_error)}</div>`:''}
        <section class="send-detail-section"><h4>邮件正文</h4>${detail.content_available?`<pre class="send-detail-body">${esc(content.text||(content.html?'这封邮件仅包含 HTML 正文，请展开下方预览。':'这封邮件没有可显示的正文。'))}</pre>${content.html?`<details class="send-disclosure send-detail-section" ${content.text?'':'open'}><summary>HTML 正文预览</summary><div id="send-detail-html"></div></details>`:''}`:'<div class="notice warning">此记录没有保存原始邮件内容，仅保留发送状态与地址信息。</div>'}</section>

        <section class="send-detail-section"><h4>接受 / 拒绝的收件地址</h4><div class="muted">接受表示邮件服务器已接收该地址，不代表最终送达。</div><pre class="send-detail-body">${esc('接受：'+((status.accepted||[]).join('、')||'无')+'\n拒绝：'+(Object.entries(status.rejected||{}).map(([address,error])=>address+' · '+(error?.message||error?.error||JSON.stringify(error))).join('\n')||'无'))}</pre></section>

          const queued=await api('/send/queue',{method:'POST',headers:{'X-Idempotency-Key':requestId},body:JSON.stringify(payload)});if(!current())return;
          box.textContent=`已入队：${queued.request_id}，正在等待邮件服务器接受…`;
          for(let i=0;i<30;i++){
            await new Promise(resolve=>setTimeout(resolve,1000));if(!current())return;

        }catch(error){if(current()){box.className='error';box.textContent=error.message;result.textContent='提交失败'}}finally{submit.disabled=false}
      };

      if(job?.status==='succeeded'&&job.kind==='dns_apply'&&['mx','spf','dkim','dmarc'].every(name=>job.result?.checks?.[name]?.status==='failed')&&state.controlDomains.some(d=>d.domain===(job.scope||job.result?.domain)&&d.dns_provider==='dynv6'))return '记录已写入 dynv6，但公网验证未通过；请核对父区 NS 委派和解析生效情况，域名保持未就绪';
      if(job?.status==='succeeded'&&controlChecksFailed(job))return job.kind==='dns_apply'?'DNS 已应用，验证仍有未通过项，检查结果已刷新':'DNS 验证完成，仍有未通过项，检查结果已刷新';
      if(job?.result?.activation?.status==='ready')return '检查通过，域名已自动启用并移入已就绪';
      if(controlActivationPending(job))return '检查结果已刷新，域名仍在未就绪，可查看检查项和路由状态';
      if(job?.status==='succeeded'&&job.kind==='dns_apply')return 'DNS 已应用并完成验证，检查结果已刷新';
      return {succeeded:'后台任务完成，域名与 DNS 列表已刷新',partial:'任务部分完成，列表已刷新，请查看操作记录',failed:'后台任务失败，请查看操作记录',unknown:'任务结果待核对，请查看操作记录'}[job?.status]||'任务结果待核对，请查看操作记录';
    }
    function watchControlJob(job,{domain='',notify=true,onComplete=null,onCancel=null}={}){
      if(!job?.id||(!['queued','running'].includes(job.status)&&job.result?.activation?.status!=='routing_pending')||controlJobWatchers.has(job.id))return;
      controlJobWatchers.set(job.id,{attempts:0,domain,notify,onComplete,onCancel,kind:job.kind,step:job.step,latest:job,token:state.token});
      renderControlJobProgress();scheduleControlJobPoll(1000);
    }
    async function pollControlJobs(){
      controlJobPollTimer=null;if(controlJobPollRunning)return;
      controlJobPollRunning=true;
      const token=state.token,entries=[...controlJobWatchers.entries()].filter(([,w])=>w.token===token);
      const current=(id,w)=>state.token===token&&controlJobWatchers.get(id)===w;
      const observed=new Map(),completed=[],routing=[];
      let refresh=false,progressChanged=false;
      try{
        // One timer for the whole page; large batches use bounded SQLite snapshots.
        if(entries.length>=8){
          for(let offset=0;offset<entries.length;offset+=100){
            if(state.token!==token)return;
            const ids=entries.slice(offset,offset+100).map(([id])=>id);
            try{const snapshot=await api('/domain-jobs/status?ids='+encodeURIComponent(ids.join(',')));
              for(const latest of snapshot.items||[])observed.set(latest.id,latest);
            }catch{}
          }
        }else{
          await Promise.all(entries.map(async([id])=>{try{observed.set(id,await api('/domain-jobs/'+encodeURIComponent(id)))}catch{}}));
        }
        for(const [id,watcher] of entries){
          if(!current(id,watcher))continue;
          watcher.attempts++;
          const latest=observed.get(id);
          if(latest){
            const signature=JSON.stringify([latest.result?.recorded_count,latest.result?.processed_count]);
            if(latest.kind==='claim'&&latest.result?.recorded_count!==undefined&&signature!==watcher.progressSignature){watcher.progressSignature=signature;progressChanged=true}
            watcher.step=latest.step;watcher.latest=latest;
            if(['succeeded','partial','failed','unknown'].includes(latest.status)){
              if(latest.result?.activation?.status==='routing_pending'&&watcher.domain&&state.tab==='control'){
                routing.push([id,watcher,latest]);refresh=true;continue;
              }
              controlJobWatchers.delete(id);unlockControlDomain(watcher.domain);
              watchClaimHostingJobs(latest,observed);
              const continuation=controlJobWatchers.get(latest.result?.completion_job?.id);
              if(continuation){continuation.notify=watcher.notify;continuation.onComplete=watcher.onComplete;continuation.onCancel=watcher.onCancel}
              else completed.push([watcher,latest]);
              refresh=true;continue;
            }
          }
          const limit=watcher.kind==='dns_complete'?4500:watcher.kind==='dns_apply'&&latest?.result?.apply_recovery?1800:['claim','claim_setup','dns_hosting','dynv6_register'].includes(watcher.kind)||latest?.status==='queued'?1800:watcher.kind==='dns_repair'?450:150;
          if(watcher.attempts>=limit){
            controlJobWatchers.delete(id);unlockControlDomain(watcher.domain);
            if(watcher.notify&&state.tab==='control')toast('任务仍在后台处理，可在“持久任务 / 操作记录”中查看进度',true);
            try{watcher.onComplete?.({status:'unknown'})}catch{}
          }
        }
        if(state.token!==token)return;
        if(completed.length){state.mailDomains=[];state.domains=[]}
        const progressRefresh=progressChanged&&Date.now()-controlJobProgressRefreshAt>=10000;
        let refreshed=false;
        if(state.tab==='control'&&(refresh||progressRefresh)){
          // All completions share one list refresh, preserving filters and dialogs.
          refreshed=await refreshControlLists();controlJobProgressRefreshAt=Date.now();
        }
        if(state.token!==token)return;
        for(const [id,watcher,latest] of routing){
          if(!current(id,watcher))continue;
          const live=state.controlDomains.find(d=>d.domain===watcher.domain);
          if(refreshed&&live&&controlDomainReady(live))latest.result.activation.status='ready';
          else if((watcher.readinessAttempts=(watcher.readinessAttempts||0)+1)<15)continue;
          controlJobWatchers.delete(id);unlockControlDomain(watcher.domain);completed.push([watcher,latest]);
        }
        if(state.tab==='control'){renderControlJobProgress();renderControlUnifiedResults()}
        for(const [watcher,latest] of completed){
          if(state.token!==token)return;
          invalidateCachedPages('domains','control');if(watcher.notify&&state.tab==='control')toast(controlJobNotice(latest),latest.status!=='succeeded'||controlChecksFailed(latest)||controlActivationPending(latest));
          try{watcher.onComplete?.(latest)}catch{}
        }
      }finally{
        controlJobPollRunning=false;scheduleControlJobPoll();
      }
    }
    function controlKey(){return 'ui-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2))}
    async function controlJob(path,body={},options={}){
      const token=state.token;
      const identity=JSON.stringify([path,body]);
      if(!controlPendingKeys.has(identity))controlPendingKeys.set(identity,controlKey());
      const domain=options.domain||controlJobDomain(path),notify=options.notify!==false;
      lockControlDomain(domain);
      const processing=Boolean(domain&&/\/(dns-apply|dns-validate|dns-hosting|cloudflare-hosting|dns-repair)$/.test(path));
      if(processing){beginControlProcessing(domain);if(state.tab==='control')renderControlUnifiedResults()}
      let job;
      try{
        job=await api(path,{method:'POST',headers:{'Idempotency-Key':controlPendingKeys.get(identity)},body:JSON.stringify(body)});
      }catch(error){if(state.token===token){if(processing)endControlProcessing(domain);unlockControlDomain(domain);if(processing&&state.tab==='control')renderControlUnifiedResults()}throw error}
      if(state.token!==token)return job;
      controlPendingKeys.delete(identity);
      if(['queued','running'].includes(job?.status)||job?.result?.activation?.status==='routing_pending'){
        const existing=controlJobWatchers.get(job.id);
        if(existing){
          unlockControlDomain(domain);
          const completed=existing.onComplete,cancelled=existing.onCancel;
          existing.onComplete=latest=>{try{completed?.(latest)}finally{options.onComplete?.(latest)}};
          existing.onCancel=()=>{try{cancelled?.()}finally{options.onCancel?.()}};
        }else watchControlJob(job,{domain,notify,onComplete:options.onComplete,onCancel:options.onCancel});
      }
      else {
        unlockControlDomain(domain);state.mailDomains=[];state.domains=[];
        watchClaimHostingJobs(job);
        if(state.tab==='control')await refreshControlLists();
        const continuation=controlJobWatchers.get(job.result?.completion_job?.id);
        if(continuation){continuation.notify=notify;continuation.onComplete=options.onComplete;continuation.onCancel=options.onCancel}
        else if(state.token===token)try{options.onComplete?.(job)}catch{}
      }
      if(processing&&state.token===token){endControlProcessing(domain);if(state.tab==='control')renderControlUnifiedResults()}
      if(notify&&state.token===token)toast(['queued','running'].includes(job?.status)?(path.endsWith('/dns-repair')?'修复任务已提交，将核对权威 DNS、按需重建并等待验证后刷新列表':path.endsWith('/dns-apply')?'任务已提交，应用后自动验证并刷新列表':body.activate_on_success?'验证与启用任务已提交，检查通过后启用并刷新列表':'任务已提交，完成后自动刷新列表'):controlJobNotice(job),!['queued','running','succeeded'].includes(job?.status)||controlChecksFailed(job)||controlActivationPending(job));
      return job;
    }

        try{

          if(!current())return;message.className='notice';message.textContent=save?'会话检查通过，已加密保存。':'已存会话检查通过。';

    function showDynv6RegistrationDialog(rows=null){
      rows=(rows||selectedControlDomains()).filter(d=>!d.enabled&&!controlDomainBusy(d.domain));
      if(!rows.length)return;

    async function registerControlDynv6(rows,ref){
      const token=state.token,names=rows.map(d=>d.domain).sort(),body={domains:names,credential_ref:ref,bind:true,max_subdomain_depth:1};
      const identity=JSON.stringify(['/dynv6/registrations',body]);
      if(!controlPendingKeys.has(identity))controlPendingKeys.set(identity,controlKey());
      rows.forEach(d=>lockControlDomain(d.domain));renderControlUnifiedResults();
      let transferred=new Set(),batch=null;
      try{
        const data=await api('/dynv6/registrations',{method:'POST',headers:{'Idempotency-Key':controlPendingKeys.get(identity)},body:JSON.stringify(body)});
        if(state.token!==token)return;
        controlPendingKeys.delete(identity);
        const jobs=data.items||[],errors=data.errors||[];
        batch={kind:'dynv6',phase:'running',total:rows.length,expected:jobs.length,completed:0,results:[],errors:errors.length};
        state.controlBatches.add(batch);
        const complete=job=>{
          batch.completed++;batch.results.push(job);renderControlJobProgress();
          if(batch.completed<batch.expected)return;
          state.controlBatches.delete(batch);renderControlJobProgress();
          const failed=batch.results.filter(j=>j.status!=='succeeded');
          if(state.tab==='control'&&state.token===token)toast(`dynv6 接入完成：成功 ${batch.results.length-failed.length}，待处理 ${failed.length+errors.length}${failed.length?'；'+controlJobNotice(failed[0]):''}`,failed.length+errors.length>0);
        };
        for(const job of jobs){
          transferred.add(job.scope);
          if(['queued','running'].includes(job.status)){
            if(controlJobWatchers.has(job.id)){
              unlockControlDomain(job.scope);
              const watcher=controlJobWatchers.get(job.id),previous=watcher.onComplete;
              watcher.onComplete=latest=>{previous?.(latest);complete(latest)};
            }else watchControlJob(job,{domain:job.scope,notify:false,onComplete:complete});
          }else{unlockControlDomain(job.scope);complete(job)}
        }
        if(!jobs.length){state.controlBatches.delete(batch);throw Error(errors.map(e=>e.domain+': '+(typeof e.message==='string'?e.message:'未入队')).join('；')||'没有可提交的域名')}
        if(errors.length)toast(`${jobs.length} 个已入队，${errors.length} 个未入队：${errors.map(e=>e.domain).join('、')}`,true);
        else if(batch.completed<batch.expected)toast(`已提交 ${jobs.length} 个 dynv6 接入任务，完成后自动刷新列表`);
        await refreshControlLists();
      }finally{
        if(state.token===token){rows.filter(d=>!transferred.has(d.domain)).forEach(d=>unlockControlDomain(d.domain));renderControlUnifiedResults();renderControlJobProgress()}
      }
    }

    async function previewControlDns(domain,current=()=>true){
      const path='/mail-domains/'+encodeURIComponent(domain.domain);
      let preview;
      try{preview=await api(path+'/dns-preview',{method:'POST'})}
      catch(error){
        if(!((error.code==='digitalplat_dns_not_enabled'&&domain.dns_provider==='digitalplat')||(error.code==='cloudflare_zone_not_accessible'&&domain.dns_provider==='cloudflare'))||!current())throw error;
        await new Promise((resolve,reject)=>{
          controlJob(path+'/dns-hosting',{},{
            notify:false,onCancel:()=>reject(Error('当前操作已结束，请重新预览')),
            onComplete:job=>{
              if(!current()){reject(Error('当前操作已结束，请重新预览'));return}
              if(job?.status==='succeeded'&&job.result?.hosting_status==='ready')resolve();
              else reject(Error(controlHostingError(job)));
            },
          }).then(()=>{if(!current())reject(Error('当前操作已结束，请重新预览'))}).catch(reject);
        });
        if(!current())throw Error('当前操作已结束，请重新预览');
        preview=await api(path+'/dns-preview',{method:'POST'});
      }
      if(!current())throw Error('当前操作已结束，请重新预览');
      if(preview.domain!==domain.domain)throw Error('预览域名不匹配，请刷新后重试');
      const pending=(preview.conflicts||[]).filter(c=>c.code==='unresolved_dns_write'&&c.operation_id);
      if(['digitalplat','dynv6'].includes(domain.dns_provider)&&pending.length){
        for(const conflict of pending){
          if(!current())throw Error('当前操作已结束，请重新预览');
          await api(path+'/dns-operations/'+encodeURIComponent(conflict.operation_id)+'/reconcile',{method:'POST'});
        }
        if(!current())throw Error('当前操作已结束，请重新预览');
        preview=await api(path+'/dns-preview',{method:'POST'});
        if(!current())throw Error('当前操作已结束，请重新预览');
        if(preview.domain!==domain.domain)throw Error('预览域名不匹配，请刷新后重试');
      }
      return preview;
    }
    async function mapControlBatch(items,run,current,limit=3){
      let cursor=0,failure;const results=new Array(items.length);
      await Promise.all(Array.from({length:Math.min(limit,items.length)},async()=>{
        while(cursor<items.length&&!failure){
          if(!current()){failure=Error('当前操作已结束，请重新操作');break}
          const index=cursor++;
          try{results[index]=await run(items[index],index)}catch(error){failure??=error}
        }
      }));
      // Settle in-flight requests before releasing their row holds on failure.
      if(failure)throw failure;return results;
    }

        domains:state.controlDomains.length,
        dnsCredentials:state.controlCredentials.filter(c=>CONTROL_CONFIG_PROVIDERS.includes(c.provider)).length,
        sourceCredentials:state.controlCredentials.filter(c=>['sfreg_mx','legacy_digitalplat_pool','cloudflare_import'].includes(c.provider)).length
      };
    }
    async function refreshControlLists(){
      const token=state.token;
      if(controlRefreshRequest?.token===token)return controlRefreshRequest.promise;
      const request={token,promise:null};
      request.promise=loadControlLists().finally(()=>{if(controlRefreshRequest===request)controlRefreshRequest=null});
      controlRefreshRequest=request;return request.promise;
    }
    async function loadControlLists(){
      const token=state.token;
      try{
        const [sources,credentials,jobs,domains,claims]=await Promise.all([api('/domain-sources'),api('/dns-credentials'),api('/domain-jobs?limit=1'),api('/mail-domains'),api('/domain-claims')]);
        if(state.tab!=='control'||state.token!==token)return false;
        state.controlSources=sources.items||[];state.controlDomains=domains;state.controlClaims=claims?.items||[];state.controlHosting=jobs.domain_hosting||{};state.controlCredentials=credentials.items||[];state.controlGlobalCloudflare=credentials.global_cloudflare||{configured:false};
        const jobSummary=controlJobSummary(jobs),pendingJobs=jobSummary.active;
        const blockedSources=new Set(jobs.blocked_claim_sources||jobs.items.filter(j=>j.kind==='claim'&&['queued','running','unknown'].includes(j.status)).map(j=>j.scope));
        controlUpdateHtml($('#control-sources-body'),controlSourcesMarkup(state.controlSources,blockedSources));
        const sourceSummary=$('#control-source-summary');if(sourceSummary){controlUpdateText(sourceSummary,state.controlSources.map(s=>s.name).join('、')||'尚未配置来源');sourceSummary.title=sourceSummary.textContent}
        const overview=controlOverviewCounts();
        controlUpdateText($('#control-stat-domains'),overview.domains);
        controlUpdateText($('#control-stat-sources'),state.controlSources.length);
        controlUpdateText($('#control-stat-credentials'),overview.dnsCredentials);
        controlUpdateText($('#control-stat-source-credentials'),overview.sourceCredentials);
        controlUpdateText($('#control-stat-pending'),pendingJobs);
        controlUpdateText($('#control-stat-pending-note'),jobSummary.unknown?`${jobSummary.unknown} 个待核对`:'');
        watchActiveDomainJobs(jobs);
        renderControlUnifiedResults();
        bindControlSourceActions(state.controlSources,blockedSources);
        return true;
      }catch(e){if(state.tab==='control')toast(e.message,true);return false}
    }
    function bindControlSourceActions(sources,blockedSources){
      state.controlBlockedSources=blockedSources;
      const run=fn=>async()=>{try{await fn()}catch(e){toast(e.message,true)}};
      $$('[data-source-candidates]').forEach(b=>b.onclick=run(()=>{const source=sources.find(s=>s.id===b.dataset.sourceCandidates);return showSourceCandidates({...source,claim_blocked:blockedSources.has(source.id)})}));
      $$('[data-source-toggle]').forEach(b=>b.onclick=run(async()=>{const s=sources.find(x=>x.id===b.dataset.sourceToggle);await api('/domain-sources/'+encodeURIComponent(s.id)+'/toggle?enabled='+(!s.enabled),{method:'POST'});await refreshControlLists()}));
      $$('[data-source-allocate]').forEach(b=>b.onclick=async()=>{const source=sources.find(x=>x.id===b.dataset.sourceAllocate);if(source.source_type!=='cloudflare_import'){showSourceClaimDialog({...source,claim_blocked:blockedSources.has(source.id)});return}b.disabled=true;try{const domain=await appPrompt('输入已控制的域名（导入后停用）','');if(!domain)return;await controlJob('/domain-sources/'+encodeURIComponent(source.id)+'/import',{domain});await refreshControlLists()}catch(e){toast(e.message,true)}finally{b.disabled=false}});
    }

    async function controlPage(){
      const revision=++controlRevision;
      const token=state.token,page=$('#page');
      $('#page').innerHTML='<div class="empty">正在加载来源、DNS 凭据和持久任务…</div>';
      try{
        const [sources,credentials,jobs,domains,claims]=await Promise.all([api('/domain-sources'),api('/dns-credentials'),api('/domain-jobs?limit=1'),api('/mail-domains'),api('/domain-claims')]);
        if((revision!==controlRevision||$('#page')!==page)||state.tab!=='control'||state.token!==token)return;
        state.controlSources=sources.items||[];state.controlDomains=domains;state.controlClaims=claims?.items||[];state.controlHosting=jobs.domain_hosting||{};state.controlCredentials=credentials.items||[];state.controlGlobalCloudflare=credentials.global_cloudflare||{configured:false};
        controlPreview=null;
        const sourceLabel=s=>s==='sfreg_mx'?'SFREG MX':s==='legacy_digitalplat_pool'?'DigitalPlat 域名池':'Cloudflare 导入';
        const jobSummary=controlJobSummary(jobs),pendingJobs=jobSummary.active;
        const overview=controlOverviewCounts();
        const blockedSources=new Set(jobs.blocked_claim_sources||jobs.items.filter(j=>j.kind==='claim'&&['queued','running','unknown'].includes(j.status)).map(j=>j.scope));
        const sourceSummary=sources.items.map(s=>s.name).join('、')||'尚未配置来源';
        $('#page').innerHTML=`<div class="control-page"><div class="page-head"><div><h2>来源与 DNS</h2><p>领取 → 配置 DNS → 验证 → 启用；按域名自动推进，已完成的步骤直接跳过。</p></div><div class="head-actions"><button class="btn btn-secondary" id="control-reload">↻ 刷新</button><button class="btn btn-secondary" id="open-control-tasks" title="持久任务 / 操作记录">任务记录</button><button class="btn btn-secondary" id="dynv6-session-settings">dynv6 账号</button><button class="btn btn-primary" id="control-start-claim">领取域名</button></div></div>
        <div class="control-overview">
          <div class="control-grid" role="group" aria-label="配置概览">
            <div class="control-stat" title="全部已管理域名，不受当前搜索、Provider 和状态筛选影响"><span class="muted">域名总数</span><strong id="control-stat-domains">${overview.domains}</strong></div>
            <div class="control-stat"><span class="muted">域名来源</span><strong id="control-stat-sources">${sources.items.length}</strong></div>
            <div class="control-stat" title="按已保存的 DNS 凭据计数，包含迁移前保留及未绑定凭据；一个凭据可管理多个域名"><span class="muted">DNS 凭据</span><strong id="control-stat-credentials">${overview.dnsCredentials}</strong></div>
            <div class="control-stat" title="仅统计域名领取或导入使用的来源凭据，与 DNS 管理凭据分开统计"><span class="muted">来源凭据</span><strong id="control-stat-source-credentials">${overview.sourceCredentials}</strong></div>
            <div class="control-stat"><span class="muted">待处理任务</span><strong id="control-stat-pending">${pendingJobs}</strong><small id="control-stat-pending-note">${jobSummary.unknown?`${jobSummary.unknown} 个待核对`:''}</small></div>
          </div>
          <div id="control-job-progress" class="notice" role="status" aria-live="polite" hidden></div>
        </div>
        <details class="panel control-source-panel" id="control-source-panel"${sources.items.length?'':' open'}>
          <summary><span class="control-source-heading"><span class="panel-title">来源配置</span><span class="muted" id="control-source-summary" title="${esc(sourceSummary)}">${esc(sourceSummary)}</span></span><span class="control-source-toggle"><span class="control-source-expand">展开</span><span class="control-source-collapse">收起</span></span></summary>
          <div class="panel-body"><div class="toolbar" style="margin-bottom:12px"><button class="btn btn-secondary" id="add-dns-credential">添加 DNS 凭据</button><button class="btn btn-secondary" id="add-domain-source">＋ 添加域名来源</button></div><div id="control-sources-body">${controlSourcesMarkup(sources.items,blockedSources)}</div></div>
        </details>
        ${controlUnifiedPanel()}
        </div>`;
        $('#control-reload').onclick=()=>refreshControlLists();$('#control-start-claim').onclick=()=>{const sources=state.controlSources.filter(s=>s.enabled&&s.source_type!=='cloudflare_import');if(sources.length===1){showSourceClaimDialog({...sources[0],claim_blocked:(state.controlBlockedSources||blockedSources).has(sources[0].id)});return}$('#control-source-panel').open=true;$('#control-source-panel').scrollIntoView?.({block:'nearest'});if(!sources.length)showSourceCreateDialog()};$('#open-control-tasks').onclick=showControlTasks;
        $('#add-domain-source').onclick=showSourceCreateDialog;$('#add-dns-credential').onclick=showCredentialCreateDialog;$('#dynv6-session-settings').onclick=showDynv6AccountsDialog;
        bindControlSourceActions(sources.items,blockedSources);
        watchActiveDomainJobs(jobs);
        renderControlUnifiedResults();
        $('#reload-control-dns').onclick=()=>refreshControlLists();
        $('#control-dns-all').onchange=()=>{const {items}=controlUnifiedListData();items.filter(d=>!controlDomainBusy(d.domain)).forEach(d=>{if($('#control-dns-all').checked)state.controlSelection.add(d.domain);else state.controlSelection.delete(d.domain)});renderControlUnifiedResults()};
        bindControlBulkMenus();
        const filter=state.controlDns;
        $('#control-dns-search').oninput=e=>{filter.query=e.target.value;filter.page=1;renderControlUnifiedResults(true)};
        $('#control-dns-search').onkeydown=e=>{if(e.key==='Enter'){filter.page=1;renderControlUnifiedResults(true)}};
        $('#control-dns-provider').onchange=e=>{filter.provider=e.target.value;filter.page=1;renderControlUnifiedResults(true)};
        $('#control-dns-size').onchange=e=>{const n=Number(e.target.value);if([10,20,50,100].includes(n)){filter.pageSize=n;filter.page=1;renderControlUnifiedResults(true)}};
        $('#clear-control-dns-search').onclick=()=>{filter.query='';filter.provider='';filter.page=1;$('#control-dns-search').value='';$('#control-dns-provider').value='';renderControlUnifiedResults(true)};
        $('#control-dns-prev').onclick=()=>{filter.page--;renderControlUnifiedResults(true)};$('#control-dns-next').onclick=()=>{filter.page++;renderControlUnifiedResults(true)};
        $('#control-dns-jump-btn').onclick=()=>{filter.page=Number($('#control-dns-jump').value);renderControlUnifiedResults(true)};$('#control-dns-jump').onkeydown=e=>{if(e.key==='Enter')return $('#control-dns-jump-btn').onclick()};
        renderControlUnifiedResults();

      }catch(e){if((revision===controlRevision&&$('#page')===page)&&state.tab==='control'&&state.token===token)$('#page').innerHTML=`<div class="notice warning">${esc(e.message)}</div>`}
    }

    render();
  </script>
</body>
</html>
